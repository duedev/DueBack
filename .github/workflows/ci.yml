name: CI

# Typecheck (tsc + svelte-check), unit tests, the accuracy testkit gate, a
# production build, and the real-OCR e2e gate (Tesseract in headless Chromium).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci skips install scripts: the only script that reaches the network is
      # onnxruntime-node's binary download (a transitive dep of the browser-only
      # transformers.js that no Node/CI path ever loads — it flaked CI with
      # ETIMEDOUT). Every other scripted dep (esbuild, sharp, tesseract.js) ships
      # its platform binaries as optionalDependencies, and the vendor-tesseract
      # prebuild is an npm *run* script, unaffected by --ignore-scripts.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run testkit --if-present
      - run: npm run build # prebuild vendors the OCR core + language data

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts for the same reason as the test job (also makes the
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD guard moot; the browser is installed
      # explicitly on the next line).
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: node tests/e2e.mjs # spawns `vite preview` itself
