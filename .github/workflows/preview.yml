name: Preview

# Every pull request from a branch in THIS repo gets its own preview site on
# Cloudflare Pages, rebuilt on each push, at a stable per-PR address
# (https://pr-<number>.<project>.pages.dev — the PR's "View deployment"
# button links it). The live site (deploy.yml, GitHub Pages) is never touched.
#
# Off until the repo owner configures it (Settings › Secrets and variables ›
# Actions). Until then the `setup` job passes with a notice naming what is
# missing, and build/deploy are skipped — never red:
#   variable CF_PAGES_PROJECT       the Pages project name, e.g. dueback-preview
#                                   (created on the first run if it's missing)
#   secret   CLOUDFLARE_API_TOKEN   a token with Account › Cloudflare Pages › Edit
#   secret   CLOUDFLARE_ACCOUNT_ID
#
# Previews are built WITHOUT the Supabase and OneDrive settings: their sign-in
# redirects are registered for the production domain only, and a preview must
# never sync PR code into real workspaces — so sign-in and "Save to OneDrive"
# are hidden there. Analytics are left off too. The OpenRouter free key IS
# baked in (it ships in the production bundle anyway), so the Cloud AI tier
# behaves as it does live.
#
# Pages rejects any single file over 25 MiB; the largest today is the
# onnxruntime wasm at ~22.5 MiB — watch it when bumping transformers.js.

on:
  pull_request:

# Build and deploy are separate jobs so the Cloudflare token never shares a
# job with PR-controlled code (npm ci, the vendoring script, the build): the
# deploy job only downloads the built files and uploads them.
permissions:
  contents: read

# A newer push to the same PR supersedes a preview still building.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Says WHY a preview didn't run: a bare "skipped" job gives no reason, and
  # the likeliest mistake is a value on the wrong tab (the project name as a
  # secret, or a token as a variable). Only true/false reaches the script,
  # never a secret's value, and no PR code is checked out here.
  setup:
    # Same-repo branches only: fork PRs get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          PROJECT_VAR: ${{ vars.CF_PAGES_PROJECT != '' }}
          PROJECT_AS_SECRET: ${{ secrets.CF_PAGES_PROJECT != '' }}
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          TOKEN_AS_VAR: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          ACCOUNT_AS_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          problems=()
          need() { # present-where-expected, present-on-the-other-tab, name, expected tab
            [ "$1" = true ] && return
            if [ "$2" = true ]; then
              problems+=("$3 is saved as a $([ "$4" = variable ] && echo secret || echo variable); it must be a $4")
            else
              problems+=("$3 ($4) is not set")
            fi
          }
          need "$PROJECT_VAR" "$PROJECT_AS_SECRET" CF_PAGES_PROJECT variable
          need "$TOKEN_SECRET" "$TOKEN_AS_VAR" CLOUDFLARE_API_TOKEN secret
          need "$ACCOUNT_SECRET" "$ACCOUNT_AS_VAR" CLOUDFLARE_ACCOUNT_ID secret
          if [ ${#problems[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "### Preview not configured" >> "$GITHUB_STEP_SUMMARY"
          for p in "${problems[@]}"; do
            echo "::notice title=Preview skipped::$p (Settings › Secrets and variables › Actions)"
            echo "- $p" >> "$GITHUB_STEP_SUMMARY"
          done

  build:
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: see ci.yml (onnxruntime-node's flaky binary download).
      - run: npm ci --ignore-scripts
      - run: npm run build # typecheck + vite build; prebuild vendors Tesseract
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # `pages deploy` asks interactively when the project doesn't exist, which
      # fails in CI — so create it first. `shell: bash` adds pipefail, so a bad
      # token fails here loudly instead of reading as "no such project".
      - name: Create the Pages project on first use
        shell: bash
        run: |
          if ! npx --yes wrangler@4 pages project list --json \
              | jq -e --arg p "$PROJECT" 'any(.[]; .["Project Name"] == $p)' > /dev/null; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
      # --branch=pr-N gives each PR a stable alias URL. The URL is read from
      # wrangler's structured output file rather than guessed: Cloudflare adds
      # a suffix to the pages.dev subdomain when the project name is taken.
      - id: deploy
        name: Upload to Cloudflare Pages
        shell: bash
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" --branch="pr-$PR_NUMBER" --commit-hash="$HEAD_SHA"
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview for #$PR_NUMBER: $url" >> "$GITHUB_STEP_SUMMARY"
